name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as a beta (prerelease)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Test & debug build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests + debug APK + lint
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: forge-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/

  release:
    name: Signed release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: ver
        run: |
          N=$(( ${{ github.run_number }} + 100 ))
          echo "code=$N" >> "$GITHUB_OUTPUT"
          echo "name=0.1.$N" >> "$GITHUB_OUTPUT"
          echo "Releasing Forge 0.1.$N (versionCode $N)"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/forge-release.jks"
          echo "FORGE_KEYSTORE_FILE=$RUNNER_TEMP/forge-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace assembleRelease \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          [ -f "$apk" ] || { echo "::error::No release APK produced"; exit 1; }
          cp "$apk" "forge-${{ steps.ver.outputs.name }}.apk"

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          git log --no-merges --pretty='- %s' -n 50 $range > notes.md
          [ -s notes.md ] || echo "- Maintenance build" > notes.md
          cat notes.md

      - name: Publish GitHub release
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            extra="--prerelease"
          fi
          gh release create "v${{ steps.ver.outputs.name }}" "forge-${{ steps.ver.outputs.name }}.apk" \
            --target "${{ github.sha }}" \
            --title "Forge ${{ steps.ver.outputs.name }}" \
            --notes-file notes.md $extra

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/forge-release.jks"
