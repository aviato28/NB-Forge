<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge - Brand and UI mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@page{size:297mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#FF6A1A;--accd:#E0560C}
.light{--bg:#FAFAFA;--sf:#FFFFFF;--sf2:#F2F2F3;--bd:#E6E6E8;--tx:#111113;--tx2:#6B6B73;--tint:#FFF1E8;--pg:#F2F2F3;--pgl:#DADADF}
.dark{--bg:#0E0E10;--sf:#18181B;--sf2:#222226;--bd:#2C2C31;--tx:#F4F4F5;--tx2:#9A9AA3;--tint:#3A2216;--pg:#2E2E33;--pgl:#46464D}
html,body{background:#d8d8dc}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
.page{width:297mm;height:209mm;overflow:hidden;position:relative;background:var(--bg);color:var(--tx);padding:32px 56px;break-after:page;page-break-after:always;margin:0 auto 16px;display:flex;flex-direction:column}
.page:last-child{break-after:auto;page-break-after:auto}
@media print{html,body{background:none}.page{margin:0}}
.ph{display:flex;align-items:baseline;gap:16px;margin-bottom:16px;flex:none}
.ph .n{color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.06em}
.ph h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
.ph p{font-size:13px;color:var(--tx2);margin-left:auto}
.wm{font-weight:800;letter-spacing:.08em;line-height:1}
.lock{display:inline-flex;align-items:center;gap:12px}
.row{display:flex}.center{display:flex;align-items:center;justify-content:center}
.acc{color:var(--acc)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px}
/* phones */
.phones{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;gap:40px}
.fig{display:flex;flex-direction:column;align-items:center;gap:8px}
.cap{font-size:12px;color:var(--tx2);font-weight:500}.cap b{color:var(--acc);font-weight:700;margin-right:6px}
.phone{width:360px;height:760px;border-radius:40px;background:#0A0A0B;padding:8px;flex:none;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.screen{width:100%;height:100%;border-radius:32px;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden;position:relative}
.sb{height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;flex:none}
.sb .r{display:flex;gap:6px;align-items:center}
.body{flex:1;min-height:0;padding:0 16px;display:flex;flex-direction:column;overflow:hidden}
.gest{height:24px;flex:none;display:flex;align-items:center;justify-content:center}
.gest i{width:112px;height:4px;border-radius:2px;background:var(--tx);opacity:.8}
.nav{height:60px;flex:none;display:flex;border-top:1px solid var(--bd);background:var(--sf)}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--tx2)}
.nav div.on{color:var(--acc);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;height:44px;flex:none;margin-bottom:12px}
.ib{width:36px;height:36px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.search{height:52px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--tx2);font-size:15px;flex:none}
.search.f{border:1.5px solid var(--acc);color:var(--tx)}
.caret{display:inline-block;width:2px;height:20px;background:var(--acc);vertical-align:middle;margin-left:1px}
.sh{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;margin:16px 0 8px;flex:none}
.sh a{font-size:12px;color:var(--acc);font-weight:600}
.tiles{display:flex;gap:8px;flex:none}
.tile{width:72px;height:72px;border-radius:20px;background:var(--sf);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;font-size:10.5px;font-weight:600;text-align:center;line-height:1.2}
.tile svg{color:var(--acc);flex:none}
.rec{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:8px;flex:none}
.ibox{width:40px;height:40px;border-radius:14px;background:var(--tint);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.rec .t{flex:1;min-width:0}.rec b{display:block;font-size:14px;font-weight:600}.rec small{display:block;font-size:12px;color:var(--tx2);margin-top:1px}
.rec em{font-style:normal;font-size:11px;color:var(--tx2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.cat{display:flex;align-items:center;gap:10px;padding:10px 12px;height:56px}
.cat b{display:block;font-size:14px;font-weight:600}.cat small{font-size:12px;color:var(--tx2)}
.cat .ibox{width:36px;height:36px;border-radius:12px}
.tbar{display:flex;align-items:center;height:48px;flex:none;font-size:17px;font-weight:700;gap:8px}
.tbar .sp{flex:1}.tbar .l{font-size:14px;color:var(--acc);font-weight:600}
.btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;background:var(--acc);color:#fff;flex:none}
.btn.sec{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}
.btn.big{height:56px;font-size:16px}
.chip{height:32px;border-radius:14px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.t{background:var(--tint);color:var(--acc);border-color:transparent}
.tag{font-size:11px;font-weight:600;color:var(--tx2);background:var(--sf2);border-radius:14px;padding:3px 9px}
.res{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;flex:none}
.res .t{flex:1}.res b{font-size:15px;font-weight:500}.res b i{font-style:normal;color:var(--acc);font-weight:700}
.res small{display:block;font-size:12px;color:var(--tx2);margin-top:1px}
.grp{padding:0 12px;flex:none}
.grp .r{display:flex;align-items:center;gap:12px;height:38px;font-size:14px;font-weight:500;border-bottom:1px solid var(--bd)}
.grp .r:last-child{border-bottom:0}
.grp .r svg:first-child{color:var(--acc)}.grp .r span{flex:1}.grp .r svg:last-child{color:var(--tx2)}
.seg{display:flex;background:var(--sf2);padding:4px;border-radius:14px;gap:2px;flex:none}
.seg div{flex:1;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--tx2)}
.seg div.on{background:var(--acc);color:#fff}
.lbl{font-size:12px;font-weight:600;color:var(--tx2);margin:16px 0 8px;flex:none}
.bar{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.sw{width:40px;height:24px;border-radius:12px;background:var(--bd);position:relative;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff}
.sw.on{background:var(--acc)}.sw.on::after{left:18px}
.th{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--tx2);font-weight:600}
.pgr{width:100%;height:124px;border-radius:8px;background:var(--pg);border:1px solid var(--bd);padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.pgr i{display:block;height:4px;border-radius:2px;background:var(--pgl)}
.pgr.sel{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}
.pgr .ck{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 10px}
.tool{display:flex;justify-content:space-around;padding:10px 8px;margin:auto 0 12px;flex:none}
.tool div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--tx2);width:64px}
.tool div.d{color:#E5484D}
.key{height:48px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
/* brand */
.tile-box{border-radius:20px;border:1px solid var(--bd);display:flex;align-items:flex-end;justify-content:center;gap:24px;padding:16px;height:224px}
.sub{font-size:13px;color:var(--tx2);line-height:1.45}
.swatch{width:84px}.swatch i{display:block;height:48px;border-radius:14px;border:1px solid rgba(128,128,128,.25)}
.swatch b{display:block;font-size:11px;font-weight:600;margin-top:6px}.swatch small{font-size:10.5px;color:var(--tx2)}
.browser{width:1100px;border-radius:16px;border:1px solid #E6E6E8;background:#FAFAFA;overflow:hidden;color:#111113;flex:none}
</style></head>
<body>
<div id="root"></div>
<script>
const P={
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
filetext:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
merge:'<rect x="3" y="3" width="12" height="12" rx="2"/><rect x="9" y="9" width="12" height="12" rx="2"/>',
compress:'<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
scan:'<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/>',
level:'<rect x="2" y="8" width="20" height="8" rx="4"/><circle cx="12" cy="12" r="2"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/>',
video:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10l5-3v10l-5-3"/>',
phone:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
calc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
rotate:'<path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
extract:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M12 17v-6M9.5 13.5L12 11l2.5 2.5"/>',
share:'<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>',
download:'<path d="M12 3v12M7 10l5 5 5-5M5 20h14"/>',
open:'<path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
chev:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',
down:'<path d="M6 9l6 6 6-6"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
swapv:'<path d="M8 3L4 7l4 4M4 7h12M16 21l4-4-4-4M20 17H8"/>',
flash:'<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
pen:'<path d="M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19z"/>',
type:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
layers:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',
hash:'<path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/>',
split:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5L20 18M8 16.5L20 6"/>',
grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
qr:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M20 18v3h-3"/>',
backsp:'<path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 9.5l5 5M18 9.5l-5 5"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
lockc:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'
};
const ic=(n,s=20,sw=1.75)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
/* app icons */
const A_SH=f=>`<rect x="27" y="31" width="12" height="48" rx="2.5" fill="${f}"/><rect x="27" y="31" width="34" height="12" rx="2.5" fill="${f}"/><rect x="27" y="51" width="24" height="11" rx="2.5" fill="${f}"/><path d="M70 26L73.1 33.9L81 37L73.1 40.1L70 48L66.9 40.1L59 37L66.9 33.9Z" fill="${f}"/>`;
const svg108=(s,inner)=>`<svg width="${s}" height="${s}" viewBox="0 0 108 108" style="flex:none;display:block">${inner}</svg>`;
const iconA=(s,inv)=>svg108(s,`<rect width="108" height="108" rx="24" fill="${inv?'#fff':'#FF6A1A'}"/>${A_SH(inv?'#FF6A1A':'#fff')}`);
const iconB=s=>svg108(s,`<rect width="108" height="108" rx="24" fill="#18181B"/><path d="M26 41H80Q80 53 69 53H65L67 60H73V68H35V60H41L43 53H41Q29 53 26 41Z" fill="#FF6A1A"/><path d="M70 24L71.7 28.3L76 30L71.7 31.7L70 36L68.3 31.7L64 30L68.3 28.3Z" fill="#FF6A1A"/>`);
const iconC=s=>svg108(s,`<rect width="108" height="108" rx="24" fill="#FF6A1A"/><path d="M54 28Q54 54 80 54Q54 54 54 80Q54 54 28 54Q54 54 54 28Z" fill="#fff"/><path d="M77 24Q77 31 84 31Q77 31 77 38Q77 31 70 31Q77 31 77 24Z" fill="#fff"/>`);
const lockup=(s,fs)=>`<span class="lock" style="gap:${s/4}px">${iconA(s)}<span class="wm" style="font-size:${fs}px">FORGE</span></span>`;

/* phone shell */
const batt='<svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x=".6" y=".6" width="18" height="10.8" rx="3" stroke="currentColor" stroke-width="1.2" opacity=".6"/><rect x="2.2" y="2.2" width="12" height="7.6" rx="1.6" fill="currentColor"/><rect x="19.6" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".6"/></svg>';
const sig='<svg width="14" height="12" viewBox="0 0 14 12" fill="currentColor"><rect x="0" y="8" width="2.5" height="4" rx="1"/><rect x="4" y="5" width="2.5" height="7" rx="1"/><rect x="8" y="2.5" width="2.5" height="9.5" rx="1"/><rect x="12" y="0" width="2" height="12" rx="1" opacity=".35"/></svg>';
function phone(theme,body,nav,z,style=''){
  const items=[['home','Home'],['folder','Files'],['settings','Settings']];
  const navH=nav?`<div class="nav">${items.map(([i,l])=>`<div class="${l===nav?'on':''}">${ic(i,22)}${l}</div>`).join('')}</div>`:'';
  return `<div class="phone ${theme}" style="${z?`zoom:${z};`:''}${style}"><div class="screen"><div class="sb"><span>9:41</span><span class="r">${sig}${batt}</span></div>${body}${navH}<div class="gest"><i></i></div></div></div>`;
}
const fig=(cap,k,html)=>`<div class="fig">${html}<div class="cap"><b>${k}</b>${cap}</div></div>`;
const tbar=(t,r='')=>`<div class="tbar"><span style="margin-left:-6px;display:flex">${ic('back',24)}</span><span>${t}</span><span class="sp"></span>${r}</div>`;

/* screens */
function home(theme,z){
  const pin=[['compress','Compress PDF'],['merge','Merge PDF'],['scan','Scan'],['level','Level']];
  const cats=[['filetext','PDF',43],['image','Image',11],['video','Video',7],['phone','Device',10],['calc','Utilities',12],['folder','Files',1]];
  const body=`<div class="body">
  <div class="top"><span class="lock" style="gap:8px">${iconA(26)}<span class="wm" style="font-size:15px">FORGE</span></span><span class="ib">${ic('user',18)}</span></div>
  <div class="search">${ic('search',20)}Search 90+ tools…</div>
  <div class="sh">Pinned<a>Edit</a></div>
  <div class="tiles">${pin.map(([i,n])=>`<div class="tile">${ic(i,24)}<span>${n}</span></div>`).join('')}</div>
  <div class="sh">Recent<a>See all</a></div>
  <div class="card rec"><div class="ibox">${ic('filetext',20)}</div><div class="t"><b>invoice_oct.pdf</b><small>Compressed 4.2 MB → 680 KB</small></div><em>2m</em></div>
  <div class="card rec"><div class="ibox">${ic('merge',20)}</div><div class="t"><b>contract_final.pdf</b><small>Merged 3 files · 2.4 MB</small></div><em>1h</em></div>
  <div class="sh" style="margin-top:8px">All tools</div>
  <div class="grid2">${cats.map(([i,n,c])=>`<div class="card cat"><div class="ibox">${ic(i,20)}</div><div><b>${n}</b><small>${c} ${c==1?'tool':'tools'}</small></div></div>`).join('')}</div>
  <div style="flex:1"></div></div>`;
  return phone(theme,body,'Home',z);
}
const hl=(t)=>`<i>${t.slice(0,4)}</i>${t.slice(4)}`;
function searchScreen(z){
  const r=[['compress','Compress PDF','PDF','Reduce file size'],['image','Compress image','Image','JPG, PNG, WebP'],['video','Compress video','Video','Smaller MP4 files'],['compass','Compass','Device','Heading and bearing']];
  const body=`<div class="body"><div style="height:12px;flex:none"></div>
  <div class="search f">${ic('search',20)}<span style="flex:1;font-weight:500">comp<span class="caret"></span></span><span style="display:flex">${ic('x',18)}</span></div>
  <div class="lbl" style="margin-top:20px">4 results</div>
  ${r.map(([i,n,t,s])=>`<div class="card res"><div class="ibox">${ic(i,20)}</div><div class="t"><b>${hl(n)}</b><small>${s}</small></div><span class="tag">${t}</span></div>`).join('')}
  <div class="lbl" style="margin-top:16px">Recent searches</div>
  <div class="grp card"><div class="r">${ic('clock',18)}<span>merge pdf</span>${ic('chev',16)}</div><div class="r">${ic('clock',18)}<span>qr code</span>${ic('chev',16)}</div><div class="r">${ic('clock',18)}<span>resize image</span>${ic('chev',16)}</div></div>
  <div style="flex:1"></div></div>`;
  return phone('light',body,null,z);
